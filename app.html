<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>NIJHUM DUCK Ai 👾</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #05070c;
        --panel-deep: #020617;
        --line: #1e293b;
        --line-soft: rgba(255, 255, 255, 0.07);
        --text: #e2e8f0;
        --text-strong: #f1f5f9;
        --muted: #94a3b8;
        --faint: #64748b;
        --blue: #2563eb;
        --blue-hover: #3b82f6;
        --cyan: #22d3ee;
        --green: #22c55e;
        --card-grad: linear-gradient(180deg, rgba(15, 23, 42, 0.75), rgba(11, 15, 23, 0.85));
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background-color: var(--bg);
        background-image:
          linear-gradient(rgba(148, 163, 184, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 184, 0.05) 1px, transparent 1px);
        background-size: 40px 40px;
        color: var(--text);
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 15px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        height: 100dvh;
      }
      button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
      button:focus-visible, select:focus-visible, textarea:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }
      ::selection { background: rgba(37, 99, 235, 0.45); color: #fff; }

      .saas-card {
        background: var(--card-grad);
        border: 1px solid var(--line-soft);
        border-radius: 14px;
      }

      /* ---------- Top status bar ---------- */
      .statusbar {
        flex: 0 0 auto;
        background: var(--panel-deep);
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
      }
      .statusbar-inner {
        max-width: 900px;
        margin: 0 auto;
        padding: 7px 18px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 8px rgba(34, 197, 94, 0.8);
        flex: 0 0 auto;
        animation: statusPulse 2s ease-in-out infinite;
      }
      @keyframes statusPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
      .status-label { font-weight: 700; color: var(--text-strong); white-space: nowrap; }
      .status-tag { margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .status-tag .cyan { color: var(--cyan); }

      /* ---------- Sticky header ---------- */
      header {
        flex: 0 0 auto;
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(5, 7, 12, 0.95);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(6px);
      }
      .header-inner {
        max-width: 900px;
        margin: 0 auto;
        height: 64px;
        padding: 0 18px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo-mark {
        flex: 0 0 auto;
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: var(--blue);
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .logo-mark svg { width: 21px; height: 21px; }
      .brand {
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0.01em;
        color: var(--text-strong);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .brand .duck { color: var(--cyan); }
      .api-badge {
        flex: 0 0 auto;
        background: #1e3a8a;
        color: #93c5fd;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        border-radius: 6px;
        padding: 3px 8px;
      }
      .demo-tag {
        flex: 0 0 auto;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.12em;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px 9px;
      }
      .studio-link {
        flex: 0 0 auto;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--cyan);
        border: 1px solid rgba(34, 211, 238, 0.45);
        border-radius: 999px;
        padding: 5px 11px;
        text-decoration: none;
        white-space: nowrap;
      }
      .studio-link:hover { background: rgba(34, 211, 238, 0.08); }
      .spacer { flex: 1 1 auto; }
      .icon-btn {
        flex: 0 0 auto;
        width: 38px;
        height: 38px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        color: var(--muted);
        border: 1px solid transparent;
      }
      .icon-btn:hover { background: rgba(255, 255, 255, 0.05); color: var(--text-strong); border-color: var(--line-soft); }
      .icon-btn svg { width: 19px; height: 19px; }

      /* ---------- Page wrap ---------- */
      .page {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        padding: 18px 18px 10px;
        display: flex;
        flex-direction: column;
      }
      .chat-card {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ---------- Sidebar drawer ---------- */
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 280px;
        max-width: 86vw;
        z-index: 60;
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.97), rgba(11, 15, 23, 0.98));
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        padding: 16px 14px calc(14px + env(safe-area-inset-bottom));
        transform: translateX(-105%);
        visibility: hidden;
        transition: transform 0.25s ease, visibility 0s linear 0.25s;
      }
      .sidebar.open {
        transform: translateX(0);
        visibility: visible;
        transition: transform 0.25s ease, visibility 0s;
        box-shadow: 12px 0 32px rgba(0, 0, 0, 0.55);
      }
      .sidebar-top {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 20px;
      }
      .new-chat-btn {
        flex: 1 1 auto;
        display: inline-flex;
        align-items: center;
        gap: 9px;
        background: var(--blue);
        border: 1px solid var(--blue);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 14px;
        font-weight: 700;
        color: #fff;
        text-align: left;
      }
      .new-chat-btn:hover { background: var(--blue-hover); border-color: var(--blue-hover); }
      .new-chat-btn .plus { font-size: 18px; font-weight: 800; line-height: 1; }
      .sidebar-label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--faint);
        padding: 0 6px 9px;
      }
      .chat-list {
        flex: 1 1 auto;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-height: 0;
      }
      .chat-item {
        display: block;
        width: 100%;
        text-align: left;
        border-radius: 10px;
        border: 1px solid transparent;
        padding: 9px 11px;
      }
      .chat-item:hover { background: rgba(255, 255, 255, 0.05); }
      .chat-item.active { background: rgba(37, 99, 235, 0.16); border-color: rgba(59, 130, 246, 0.35); }
      .chat-item .chat-title {
        display: block;
        font-size: 13.5px;
        font-weight: 700;
        color: var(--text-strong);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .chat-item .chat-preview {
        display: block;
        font-size: 12px;
        color: var(--faint);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 1px;
      }
      .sidebar-foot {
        flex: 0 0 auto;
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
        text-align: center;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.3em;
        color: var(--faint);
      }
      .scrim {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 23, 0.65);
        z-index: 55;
      }
      .scrim.show { display: block; }

      /* ---------- Chat area ---------- */
      .chat {
        flex: 1 1 auto;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 24px 20px 14px;
        display: flex;
        flex-direction: column;
        gap: 26px;
        scroll-behavior: smooth;
        min-height: 0;
      }

      /* user message — blue-tinted bubble on the right */
      .msg.user { display: flex; flex-direction: column; align-items: flex-end; }
      .user-bubble {
        background: rgba(37, 99, 235, 0.16);
        border: 1px solid rgba(59, 130, 246, 0.35);
        color: var(--text-strong);
        padding: 11px 15px;
        border-radius: 14px;
        border-bottom-right-radius: 5px;
        font-size: 14.5px;
        max-width: 85%;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      /* assistant reply — plain text inside the card */
      .msg.ai { display: flex; flex-direction: column; }
      .msg-meta {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 7px;
        font-size: 13px;
        font-weight: 700;
        color: var(--text-strong);
      }
      .avatar {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: var(--blue);
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
      }
      .avatar svg { width: 15px; height: 15px; }
      .msg-meta .by-model {
        font-weight: 500;
        font-size: 11px;
        color: var(--cyan);
      }
      .ai-body {
        font-size: 14.5px;
        line-height: 1.7;
        color: var(--text);
        overflow-wrap: anywhere;
      }
      .ai-body p { margin: 0 0 10px; }
      .ai-body p:last-child { margin-bottom: 0; }
      .ai-body ul { margin: 4px 0 10px; padding-left: 20px; }
      .ai-body li { margin: 3px 0; }
      .code-card {
        margin: 10px 0;
        background: #020617;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      .code-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.04);
        border-bottom: 1px solid var(--line);
      }
      .code-dots { display: inline-flex; gap: 6px; flex: 0 0 auto; }
      .code-dots i { width: 10px; height: 10px; border-radius: 50%; display: block; }
      .code-dots i:nth-child(1) { background: #f87171; }
      .code-dots i:nth-child(2) { background: #fbbf24; }
      .code-dots i:nth-child(3) { background: #22c55e; }
      .code-lang { font-size: 12px; font-weight: 700; color: var(--cyan); letter-spacing: 0.04em; }
      .code-actions { margin-left: auto; display: inline-flex; gap: 6px; }
      .code-btn {
        font-size: 11.5px;
        font-weight: 700;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 4px 10px;
      }
      .code-btn:hover { color: var(--text-strong); border-color: var(--faint); }
      .code-btn.run { color: var(--green); border-color: rgba(34, 197, 94, 0.45); }
      .code-pre {
        margin: 0;
        padding: 13px 14px;
        overflow-x: auto;
        font-size: 13px;
        line-height: 1.65;
      }
      .code-pre code { font-family: inherit; color: #e2e8f0; white-space: pre; }
      .tok-kw { color: #c4b5fd; }
      .tok-str { color: #86efac; }
      .tok-com { color: #64748b; font-style: italic; }
      .tok-num { color: #fca5a5; }
      .tok-fn { color: #7dd3fc; }
      .tok-tag { color: #f472b6; }
      .code-output {
        border-top: 1px dashed var(--line);
        padding: 10px 14px;
        font-size: 12.5px;
        color: #a5f3fc;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 220px;
        overflow-y: auto;
      }
      .code-output .out-label { color: var(--faint); font-weight: 700; font-size: 11px; letter-spacing: 0.08em; display: block; margin-bottom: 4px; }
      .agent-card {
        margin: 2px 0 4px;
        background: #020617;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      .agent-head {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 13px;
        background: rgba(255, 255, 255, 0.04);
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        font-weight: 700;
        color: var(--text-strong);
      }
      .agent-head .spinner {
        width: 14px; height: 14px; flex: 0 0 auto;
        border: 2px solid var(--line);
        border-top-color: var(--cyan);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .agent-steps { margin: 0; padding: 10px 14px 12px 30px; font-size: 12.5px; color: var(--muted); }
      .agent-steps li { margin: 5px 0; word-break: break-word; }
      .agent-steps li b { color: var(--cyan); font-weight: 700; }
      .agent-steps li.agent-result { list-style: none; margin-left: -16px; color: var(--faint); white-space: pre-wrap; }
      .preview-modal {
        position: fixed;
        inset: 0;
        z-index: 90;
        background: rgba(2, 6, 23, 0.82);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 18px;
      }
      .preview-modal.show { display: flex; }
      .preview-box {
        width: min(960px, 100%);
        height: min(82vh, 900px);
        background: #0b0f17;
        border: 1px solid var(--line);
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .preview-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        font-weight: 700;
        color: var(--text-strong);
      }
      .preview-frame { flex: 1 1 auto; width: 100%; border: 0; background: #fff; }

      .msg-actions { margin-top: 9px; display: flex; gap: 4px; }
      .copy-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--faint);
        padding: 5px 9px;
        border-radius: 8px;
        border: 1px solid transparent;
      }
      .copy-btn:hover { background: rgba(255, 255, 255, 0.05); color: var(--text-strong); border-color: var(--line-soft); }
      .copy-btn svg { width: 14px; height: 14px; }
      .copy-btn.copied { color: #4ade80; }

      /* attached file chip inside a user bubble */
      .file-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 6px 10px;
        margin-bottom: 8px;
        font-size: 12.5px;
        font-weight: 700;
        max-width: 100%;
      }
      .file-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .file-chip svg { width: 15px; height: 15px; flex: 0 0 auto; }

      /* generated image card */
      .img-card {
        margin-top: 12px;
        border: 1px solid var(--line-soft);
        border-radius: 14px;
        overflow: hidden;
        background: var(--panel-deep);
        max-width: 420px;
      }
      .img-card img { display: block; width: 100%; height: auto; }
      .img-card figcaption { padding: 10px 13px 12px; }
      .img-card .img-title { font-weight: 700; font-size: 13.5px; color: var(--text-strong); }
      .img-card .img-sub {
        font-size: 11px;
        color: var(--faint);
        margin-top: 3px;
        overflow-wrap: anywhere;
      }
      .img-loading {
        margin-top: 12px;
        width: min(420px, 100%);
        aspect-ratio: 3 / 2;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel-deep);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
        animation: pulse 1.2s ease-in-out infinite;
      }
      .spinner {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid var(--line);
        border-top-color: var(--cyan);
        animation: spin 0.8s linear infinite;
        flex: 0 0 auto;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

      /* typing indicator — pulsing cyan dots */
      .typing-dots { display: inline-flex; align-items: center; gap: 5px; padding: 6px 0; }
      .typing-dots .dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--cyan);
        animation: bounce 1.1s ease-in-out infinite;
      }
      .typing-dots .dot:nth-child(2) { animation-delay: 0.15s; }
      .typing-dots .dot:nth-child(3) { animation-delay: 0.3s; }
      @keyframes bounce {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.45; }
        30% { transform: translateY(-4px); opacity: 1; }
      }

      /* ---------- Empty state ---------- */
      .empty-state {
        margin: auto;
        text-align: center;
        max-width: 540px;
        padding: 24px 6px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .empty-duck {
        width: 60px;
        height: 60px;
        border-radius: 14px;
        background: var(--blue);
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 18px;
        box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35);
      }
      .empty-duck svg { width: 32px; height: 32px; }
      .empty-state h2 {
        color: var(--text-strong);
        font-size: 24px;
        font-weight: 800;
        line-height: 1.3;
        margin: 0 0 8px;
      }
      .empty-state p { margin: 0 0 22px; font-size: 13.5px; color: var(--muted); }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        justify-content: center;
      }
      .chip {
        border: 1px solid var(--line);
        background: var(--panel-deep);
        border-radius: 999px;
        padding: 9px 15px;
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        text-align: left;
      }
      .chip:hover { border-color: var(--blue); color: var(--text-strong); }
      .chip .chip-lead { color: var(--cyan); font-weight: 700; margin-right: 6px; }

      /* ---------- Composer ---------- */
      .composer-zone {
        flex: 0 0 auto;
        border-top: 1px solid var(--line-soft);
        padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
        background: rgba(2, 6, 23, 0.35);
      }
      .attach-preview { display: none; margin-bottom: 9px; }
      .attach-preview.show { display: block; }
      .attach-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--panel-deep);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 7px 8px 7px 12px;
        font-size: 12.5px;
        font-weight: 600;
        max-width: 100%;
      }
      .attach-chip .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
      .attach-chip .edit-note { color: var(--cyan); font-weight: 700; white-space: nowrap; }
      .attach-chip button {
        width: 22px; height: 22px; border-radius: 6px;
        display: inline-flex; align-items: center; justify-content: center;
        color: var(--muted); flex: 0 0 auto;
      }
      .attach-chip button:hover { background: rgba(255, 255, 255, 0.07); color: var(--text-strong); }
      .attach-chip button svg { width: 12px; height: 12px; }

      .composer {
        background: var(--panel-deep);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px 10px;
      }
      .composer:focus-within { border-color: var(--blue); }
      textarea {
        display: block;
        width: 100%;
        border: 0;
        background: none;
        color: var(--text-strong);
        font: inherit;
        font-size: 14.5px;
        resize: none;
        max-height: 150px;
        padding: 4px 4px 6px;
        line-height: 1.5;
      }
      textarea::placeholder { color: var(--faint); }
      textarea:focus { outline: none; }

      .composer-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-top: 6px;
        flex-wrap: wrap;
      }
      .tool-btn {
        flex: 0 0 auto;
        width: 38px; height: 38px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--panel-deep);
        display: inline-flex; align-items: center; justify-content: center;
        color: var(--muted);
      }
      .tool-btn:hover { color: var(--text-strong); border-color: var(--blue); }
      .tool-btn svg { width: 18px; height: 18px; }
      .model-group {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .model-label {
        font-size: 11px;

  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  var LANG_NAMES = {
    js: "JavaScript", javascript: "JavaScript", mjs: "JavaScript", ts: "TypeScript", typescript: "TypeScript",
    py: "Python", python: "Python", html: "HTML", htm: "HTML", css: "CSS", json: "JSON",
    bash: "Shell", sh: "Shell", shell: "Shell", zsh: "Shell", java: "Java", c: "C", cpp: "C++", "c++": "C++",
    cs: "C#", csharp: "C#", php: "PHP", rb: "Ruby", ruby: "Ruby", go: "Go", rs: "Rust", rust: "Rust",
    sql: "SQL", swift: "Swift", kt: "Kotlin", kotlin: "Kotlin", dart: "Dart", lua: "Lua", r: "R",
    xml: "XML", yml: "YAML", yaml: "YAML", md: "Markdown", text: "Text", txt: "Text", "": "Code"
  };
  var RUNNABLE = { html: true, htm: true, javascript: true, js: true, mjs: true, css: true };

  function langLabel(raw) {
    var key = String(raw || "").toLowerCase();
    return LANG_NAMES[key] || (key ? key.charAt(0).toUpperCase() + key.slice(1) : "Code");
  }

  function textToHtml(text) {
    var lines = String(text).split("\n");
    var html = "";
    var inList = false;
    var inCode = false;
    var codeLang = "";
    var codeLines = [];
    function closeList() { if (inList) { html += "</ul>"; inList = false; } }
    function flushCode() {
      var label = langLabel(codeLang);
      var runnable = !!RUNNABLE[String(codeLang || "").toLowerCase()];
      html += '<div class="code-card" data-lang="' + escapeHtml(codeLang || "") + '">'
        + '<div class="code-head"><span class="code-dots" aria-hidden="true"><i></i><i></i><i></i></span>'
        + '<span class="code-lang">' + escapeHtml(label) + '</span>'
        + '<span class="code-actions">'
        + (runnable ? '<button class="code-btn run" type="button" data-act="run">▶ Run</button>' : '')
        + '<button class="code-btn" type="button" data-act="copy">Copy</button>'
        + '</span></div>'
        + '<pre class="code-pre"><code>' + escapeHtml(codeLines.join("\n")) + '</code></pre>'
        + '<div class="code-output" hidden></div></div>';
      codeLines = [];
      codeLang = "";
    }
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var trimmed = line.trim();
      var fence = trimmed.match(/^```\s*([A-Za-z0-9#+._-]*)\s*$/);
      if (fence) {
        if (inCode) { flushCode(); inCode = false; }
        else { closeList(); inCode = true; codeLang = fence[1] || ""; codeLines = []; }
        continue;
      }
      if (inCode) { codeLines.push(line); continue; }
      if (trimmed.indexOf("- ") === 0 || trimmed.indexOf("• ") === 0 || /^\d+\.\s/.test(trimmed)) {
        if (!inList) { html += "<ul>"; inList = true; }
        html += "<li>" + escapeHtml(trimmed.replace(/^(- |• |\d+\.\s)/, "")) + "</li>";
      } else {
        closeList();
        if (trimmed !== "") html += "<p>" + escapeHtml(line) + "</p>";
      }
    }
    if (inCode) flushCode();
    closeList();
    return html;
  }

  var KEYWORDS = "const let var function return if else elif for while do switch case break continue class extends new try catch finally throw throws import from export default async await yield static void int float double char bool boolean string true false null nil None True False def print lambda in of is not and or with as pass public private protected fn mut pub struct impl enum match package func defer select type interface namespace using this self super typeof instanceof void cmd let mut ref out params event operator explicit implicit virtual override readonly sealed abstract internal protected internal set get add remove where when by lazy suspend inline crossinline noinline reified data sealed object companion init construct";

  function highlightCode(code, lang) {
    var kw = {};
    KEYWORDS.split(" ").forEach(function (w) { kw[w] = true; });
    var isHtml = lang === "html" || lang === "htm" || lang === "xml";
    var re = /(\/\*[\s\S]*?\*\/|<!--[\s\S]*?-->|\/\/[^\n]*|#[^\n]*)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`)|\b(\d+(?:\.\d+)?)\b|([A-Za-z_$][\w$]*)/g;
    var out = "";
    var last = 0;
    var m;
    while ((m = re.exec(code)) !== null) {
      out += escapeHtml(code.slice(last, m.index));
      if (m[1]) out += '<span class="tok-com">' + escapeHtml(m[1]) + '</span>';
      else if (m[2]) out += '<span class="tok-str">' + escapeHtml(m[2]) + '</span>';
      else if (m[3]) out += '<span class="tok-num">' + escapeHtml(m[3]) + '</span>';
      else if (m[4]) {
        var word = m[4];
        var next = code.charAt(re.lastIndex);
        if (isHtml && word) out += escapeHtml(word);
        else if (kw[word]) out += '<span class="tok-kw">' + escapeHtml(word) + '</span>';
        else if (next === "(") out += '<span class="tok-fn">' + escapeHtml(word) + '</span>';
        else out += escapeHtml(word);
      }
      last = re.lastIndex;
    }
    out += escapeHtml(code.slice(last));
    if (isHtml) {
      out = out.replace(/(&lt;\/?)([a-zA-Z][\w-]*)/g, '$1<span class="tok-tag">$2</span>');
    }
    return out;
  }

  function copyCodeText(text, btn) {

    function fallback() {
      var ta = document.createElement("textarea");

      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); done(); } catch (e) {}
      ta.remove();

    }
    function onMsg(e) {
      if (e.source !== iframe.contentWindow) return;
      var d = e.data || {};
      if (d.__nijhumRun) finish(Array.isArray(d.lines) ? d.lines : []);

    window.addEventListener("message", onMsg);
    var wrapped = '<script>'
      + 'var __lines=[];'
      + 'function __fmt(a){return Array.prototype.map.call(a,function(x){try{return typeof x==="object"?JSON.stringify(x):String(x);}catch(e){return String(x);}}).join(" ");}'
      + 'console.log=function(){__lines.push(__fmt(arguments));};'
      + 'console.error=function(){__lines.push("Error: "+__fmt(arguments));};'
      + 'console.warn=function(){__lines.push(__fmt(arguments));};'
      + 'window.onerror=function(m){__lines.push("Error: "+m);};'
      + '<\/script><script>try{\n' + code.replace(/<\/script/gi, "<\\/script") + '\n}catch(e){__lines.push("Error: "+(e&&e.message||e));}'

    document.body.appendChild(iframe);
    setTimeout(function () { finish(["(timed out — no output)"]); }, 5000);

  function enhanceCodeCards(root) {
    var cards = root.querySelectorAll(".code-card");
    cards.forEach(function (card) {
      var lang = (card.getAttribute("data-lang") || "").toLowerCase();
      var codeEl = card.querySelector("code");

      if (runBtn) runBtn.addEventListener("click", function () {
        if (lang === "html" || lang === "htm") {
          openPreview(raw);
        } else if (lang === "css") {
          openPreview('<!doctype html><html><head><style>' + raw + '</style></head><body><h1>Heading 1</h1><h2>Heading 2</h2><p>Sample paragraph with a <a href="#">link</a> and a <button>button</button>.</p><div class="box card container" style="margin-top:12px">Sample box (class: box / card / container)</div></body></html>');
        } else {
          runJavaScript(raw, card.querySelector(".code-output"));
        }
      });
    });
  }

  var previewModal = document.getElementById("previewModal");
  var previewClose = document.getElementById("previewClose");
  function closePreview() {
    previewModal.classList.remove("show");
    document.getElementById("previewFrame").srcdoc = "";
  }
  if (previewClose) previewClose.addEventListener("click", closePreview);
  if (previewModal) previewModal.addEventListener("click", function (e) { if (e.target === previewModal) closePreview(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closePreview(); });

  function addAiMessage(text, modelName) {
    hideEmptyState();
    var wrap = makeAiShell(modelName || currentModel());
    var body = document.createElement("div");
    body.className = "ai-body";
    body.innerHTML = textToHtml(text);
    enhanceCodeCards(body);
    wrap.appendChild(body);
    chat.appendChild(wrap);
    addCopyButton(wrap, text);
    scrollToBottom();
    return wrap;
  }

  function addAiImage(src, title, caption, modelName) {
    hideEmptyState();
    var wrap = makeAiShell(modelName || currentModel());
    var body = document.createElement("div");
    body.className = "ai-body";
    if (title) {
      var h = document.createElement("p");
      h.textContent = title;
      body.appendChild(h);
    }
    var fig = document.createElement("figure");
    fig.className = "img-card";
    fig.style.margin = "12px 0 0";
    var img = document.createElement("img");
    img.src = src;
    img.alt = title || "generated image";
    fig.appendChild(img);
    if (caption) {
      var cap = document.createElement("figcaption");
      cap.textContent = caption;
      fig.appendChild(cap);
    }
    body.appendChild(fig);
    var editBtn = document.createElement("button");
    editBtn.type = "button";
    editBtn.className = "copy-btn";
    editBtn.style.marginTop = "10px";
    editBtn.textContent = "✏️ Edit this image";
    editBtn.addEventListener("click", function () {
      setActiveImage(src);
      input.focus();
      input.scrollIntoView({ block: "nearest" });
    });
    body.appendChild(editBtn);
    wrap.appendChild(body);
    chat.appendChild(wrap);
    addCopyButton(wrap, src);
    scrollToBottom();
    return wrap;
  }

  function addUserMessage(text, fileName) {
    hideEmptyState();
    var wrap = document.createElement("div");
    wrap.className = "msg user";
    var bubble = document.createElement("div");
    bubble.className = "user-bubble";
    if (fileName) {
      var chip = document.createElement("span");
      chip.className = "file-chip";
      chip.innerHTML = CLIP_SVG;
      var nm = document.createElement("span");
      nm.textContent = fileName;
      chip.appendChild(nm);
      bubble.appendChild(chip);
      bubble.appendChild(document.createElement("br"));
    }
    bubble.appendChild(document.createTextNode(text));
    wrap.appendChild(bubble);
    chat.appendChild(wrap);
    scrollToBottom();
  }

  function showTyping(modelName, note) {
    var wrap = makeAiShell(modelName);
    var body = document.createElement("div");
    body.className = "ai-body";
    var dots = document.createElement("span");
    dots.className = "typing-dots";
    for (var i = 0; i < 3; i++) {
      var d = document.createElement("span");
      d.className = "dot";
      dots.appendChild(d);
    }
    body.appendChild(dots);
    if (note) {
      var n = document.createElement("span");
      n.textContent = " " + note;
      n.style.color = "#94a3b8";
      n.style.fontSize = "12px";
      body.appendChild(n);
    }
    wrap.appendChild(body);
    chat.appendChild(wrap);
    scrollToBottom();
    return wrap;
  }

  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }

  function updateModeHint() {
    if (agentMode) {
      modeHint.textContent = "On — agent step by step kaj korbe";
      input.placeholder = "Ekta kaj daw — search, code run, file shoho kore dibo…";
    } else if (imageMode) {
      modeHint.textContent = "On — prompt diye chhobi banabe";
      input.placeholder = "Kon chhobi banabo? prompt lekho…";
    } else {
      modeHint.textContent = "Off — normal chat replies";
      input.placeholder = "Message NIJHUM DUCK Ai…";
    }
  }
  function setImageMode(on) {
    imageMode = !!on;
    if (imageMode && agentMode) {
      agentMode = false;
      agentToggle.classList.remove("on");
      agentToggle.setAttribute("aria-pressed", "false");
    }
    imageToggle.classList.toggle("on", imageMode);
    imageToggle.setAttribute("aria-pressed", imageMode ? "true" : "false");
    updateModeHint();
  }
  function setAgentMode(on) {
    agentMode = !!on;
    if (agentMode && imageMode) {
      imageMode = false;
      imageToggle.classList.remove("on");
      imageToggle.setAttribute("aria-pressed", "false");
    }
    agentToggle.classList.toggle("on", agentMode);
    agentToggle.setAttribute("aria-pressed", agentMode ? "true" : "false");
    updateModeHint();
  }

  function clearAttachment() {
    attachedFile = null;
    pendingEdit = null;
    fileInput.value = "";
    attachPreview.classList.remove("show");
    attachName.textContent = "";
  }

  attachBtn.addEventListener("click", function () { fileInput.click(); });
  fileInput.addEventListener("change", function () {
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;
    attachedFile = f;
    attachName.textContent = f.name;
    attachPreview.classList.add("show");
  });
  attachRemove.addEventListener("click", clearAttachment);

  imageToggle.addEventListener("click", function () { setImageMode(!imageMode); });
  agentToggle.addEventListener("click", function () { setAgentMode(!agentMode); });

  modelSelect.addEventListener("change", function () {
    var opt = modelSelect.options[modelSelect.selectedIndex];
    modelId.textContent = opt.getAttribute("data-id") || "";
  });

  input.addEventListener("input", autoGrow);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit ? form.requestSubmit() : send();
    }
  });
  form.addEventListener("submit", function (e) { e.preventDefault(); send(); });

  function loadSessions() {
    try { return JSON.parse(localStorage.getItem("nijhum-chats") || "[]"); } catch (e) { return []; }
  }
  function saveSessions(list) {
    try { localStorage.setItem("nijhum-chats", JSON.stringify(list.slice(0, 20))); } catch (e) {}
  }
  function persist() {
    if (!items.length) return;
    var list = loadSessions();
    var title = (items.find(function (x) { return x.who === "user"; }) || {}).text || "Chat";
    var rec = { id: currentId || Date.now(), title: title.slice(0, 42), items: items };
    var idx = list.findIndex(function (x) { return x.id === rec.id; });
    if (idx >= 0) list[idx] = rec; else list.unshift(rec);
    currentId = rec.id;
    saveSessions(list);
    renderChatList();
  }
  function renderChatList() {
    chatList.innerHTML = "";
    loadSessions().forEach(function (rec) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "chat-item" + (rec.id === currentId ? " active" : "");
      var t = document.createElement("span");
      t.className = "chat-title";
      t.textContent = rec.title;
      var pv = document.createElement("span");
      pv.className = "chat-preview";
      pv.textContent = rec.items.length + " messages";
      btn.appendChild(t);
      btn.appendChild(pv);
      btn.addEventListener("click", function () {
        if (busy) return;
        closeSidebar();
        openSession(rec);
      });
      chatList.appendChild(btn);
    });
  }
  function renderItems() {
    chat.innerHTML = "";
    if (!items.length) { showEmptyState(); return; }
    items.forEach(function (it) {
      if (it.who === "user") addUserMessage(it.text, it.fileName || null);
      else if (it.img) addAiImage(it.img, it.title || "", it.caption || "", it.model);
      else if (it.who === "agent") renderAgentSteps(it);
      else addAiMessage(it.text, it.model);
    });
  }
  function openSession(rec) {
    currentId = rec.id;
    items = rec.items.slice();
    history = [];
    items.forEach(function (it) {
      if (it.who === "user") history.push({ role: "user", content: it.text });
      else if (!it.img) history.push({ role: "assistant", content: it.text });
    });
    renderItems();
    renderChatList();
  }

  function openSidebar() { sidebar.classList.add("open"); scrim.classList.add("show"); }
  function closeSidebar() { sidebar.classList.remove("open"); scrim.classList.remove("show"); }
  menuBtn.addEventListener("click", openSidebar);
  sidebarClose.addEventListener("click", closeSidebar);
  scrim.addEventListener("click", closeSidebar);

  newChatBtn.addEventListener("click", function () {
    if (busy) return;
    persist();
    currentId = null;
    items = [];
    history = [];
    clearAttachment();
    closeSidebar();
    renderItems();
    renderChatList();
    input.focus();
  });

  var SUGGESTIONS = [
    { lead: "Write", text: "Dhaka niye ekta chhoto kobita lekho", image: false },
    { lead: "Explain", text: "Quantum computing shohoj kore bujhiye daw", image: false },
    { lead: "Draw", text: "A cat astronaut in space", image: true },
    { lead: "Ask", text: "Kon kon model ache tomar kache?", image: false }
  ];

  function showEmptyState() {
    chat.innerHTML = "";
    var empty = document.createElement("div");
    empty.className = "empty-state";
    var duck = document.createElement("div");
    duck.className = "empty-duck";
    duck.setAttribute("aria-hidden", "true");
    duck.innerHTML = DUCK_SVG;
    var h = document.createElement("h2");
    h.textContent = "Ki niye chat korte chao?";
    var p = document.createElement("p");
    p.textContent = "Assalamu alaikum! Ami NIJHUM DUCK Ai 👾 — niche theke ekta suggestion beche nao, ba nijer message lekho.";
    var chips = document.createElement("div");
    chips.className = "chips";
    SUGGESTIONS.forEach(function (sug) {
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip";
      var lead = document.createElement("span");
      lead.className = "chip-lead";
      lead.textContent = sug.lead;
      chip.appendChild(lead);
      chip.appendChild(document.createTextNode(sug.text));
      chip.addEventListener("click", function () {
        if (busy) return;
        setImageMode(!!sug.image);
        input.value = sug.text;
        autoGrow();
        send();
      });
      chips.appendChild(chip);
    });
    empty.appendChild(duck);
    empty.appendChild(h);
    empty.appendChild(p);
    empty.appendChild(chips);
    chat.appendChild(empty);
  }

  function renderAgentSteps(item) {
    hideEmptyState();
    var wrap = makeAiShell(item.model || currentModel());
    var card = document.createElement("div");
    card.className = "agent-card";
    var head = document.createElement("div");
    head.className = "agent-head";
    head.textContent = "🤖 Agent steps";
    var list = document.createElement("ol");
    list.className = "agent-steps";
    (item.steps || []).forEach(function (s) {
      var li = document.createElement("li");
      li.textContent = s;
      list.appendChild(li);
    });
    card.appendChild(head);
    card.appendChild(list);
    wrap.appendChild(card);
    chat.appendChild(wrap);
    return wrap;
  }

  function runAgentFlow(task, modelName) {
    hideEmptyState();
    var wrap = makeAiShell(modelName);
    var card = document.createElement("div");
    card.className = "agent-card";
    var head = document.createElement("div");
    head.className = "agent-head";
    var spin = document.createElement("span");
    spin.className = "spinner";
    var headText = document.createElement("span");
    headText.textContent = "🤖 Agent working…";
    head.appendChild(spin);
    head.appendChild(headText);
    var list = document.createElement("ol");
    list.className = "agent-steps";
    card.appendChild(head);
    card.appendChild(list);
    wrap.appendChild(card);
    chat.appendChild(wrap);
    scrollToBottom();

    var stepsLog = [];
    var done = false;

    function finishAll(finalReply, imageObj, errText) {
      if (done) return;
      done = true;
      spin.remove();
      headText.textContent = errText ? "⚠️ Agent theme geche" : "✅ Agent kaj sesh";
      busy = false;
      sendBtn.disabled = false;
      items.push({ who: "agent", steps: stepsLog, model: modelName });
      if (errText) {
        addAiMessage("Error: " + errText, modelName);
        items.push({ who: "ai", text: "Error: " + errText, model: modelName });
      }
      if (imageObj && imageObj.src) {
        addAiImage(imageObj.src, imageObj.title || "", imageObj.revised_prompt || "", modelName);
        items.push({ who: "ai", img: imageObj.src, title: imageObj.title || "", caption: imageObj.revised_prompt || "", model: modelName });
        setActiveImage(imageObj.src);
      }
      if (finalReply) {
        addAiMessage(finalReply, modelName);
        items.push({ who: "ai", text: finalReply, model: modelName });
        history.push({ role: "user", content: task });
        history.push({ role: "assistant", content: finalReply });
      }
      persist();
      input.focus();
    }

    function handleEvent(ev) {
      if (ev.type === "step") {
        var li = document.createElement("li");
        var b = document.createElement("b");
        b.textContent = (ev.label || ev.tool || "Step") + " ";
        var d = document.createElement("span");
        d.textContent = ev.detail || "";
        li.appendChild(b);
        li.appendChild(d);
        list.appendChild(li);
        stepsLog.push((ev.label || ev.tool || "Step") + " " + (ev.detail || ""));
        scrollToBottom();
      } else if (ev.type === "result") {
        var li2 = document.createElement("li");
        li2.className = "agent-result";
        li2.textContent = "↳ " + (ev.summary || "");
        list.appendChild(li2);
        scrollToBottom();
      } else if (ev.type === "final") {
        finishAll(ev.reply || "", ev.image || null, null);
      } else if (ev.type === "error") {
        finishAll("", null, ev.error || "unknown error");
      }
    }

    function parseChunk(text) {
      text.split("\n").forEach(function (line) {
        line = line.trim();
        if (line.indexOf("data:") === 0) {
          try { handleEvent(JSON.parse(line.slice(5).trim())); } catch (e) {}
        }
      });
    }

    fetch("/agent", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ task: task, model: modelName })
    }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      if (!res.body || !res.body.getReader) {
        return res.text().then(function (all) { all.split("\n\n").forEach(parseChunk); });
      }
      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buf = "";
      function pump() {
        return reader.read().then(function (r) {
          if (r.done) {
            if (!done) finishAll("", null, "Stream bondho hoye geche — final answer ashe ni");
            return;
          }
          buf += decoder.decode(r.value, { stream: true });
          var parts = buf.split("\n\n");
          buf = parts.pop();
          parts.forEach(parseChunk);
          return pump();
        });
      }
      return pump();
    }).catch(function (e) { finishAll("", null, e.message); });
  }

  function setActiveImage(src) {
    pendingEdit = src;
    attachedFile = null;
    attachName.textContent = "\uD83D\uDDBC current image — next message will edit it (tap \u2715 for normal chat)";
    attachPreview.classList.add("show");
  }

  function fileToDataUrl(file) {
    return createImageBitmap(file).then(function (bmp) {
      var scale = Math.min(1, 1024 / Math.max(bmp.width, bmp.height));
      var cv = document.createElement("canvas");
      cv.width = Math.round(bmp.width * scale);
      cv.height = Math.round(bmp.height * scale);
      cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
      return cv.toDataURL("image/png");
    });
  }

  function api(path, body) {
    return fetch(path, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok || j.error) throw new Error(typeof j.error === "string" ? j.error : (j.error && j.error.message) || ("HTTP " + r.status));
        return j;
      });
    });
  }

  function send() {
    var text = input.value.trim();
    if (busy) return;
    if (!text && !attachedFile && !pendingEdit) return;
    var modelName = currentModel();
    var file = attachedFile;
    var editSrc = pendingEdit;
    var fileName = file ? file.name : editSrc ? "generated image" : null;
    if (!text) text = file ? "Edit this photo" : text;
    var wasImageMode = imageMode;

    if (agentMode && !file && !editSrc) {
      addUserMessage(text, null);
      items.push({ who: "user", text: text, fileName: null });
      input.value = "";
      autoGrow();
      clearAttachment();
      busy = true;
      sendBtn.disabled = true;
      runAgentFlow(text, modelName);
      return;
    }

    addUserMessage(text, fileName);
    items.push({ who: "user", text: text, fileName: fileName });
    input.value = "";
    autoGrow();
    clearAttachment();
    busy = true;
    sendBtn.disabled = true;

    var typing = showTyping(modelName, (file || editSrc) ? "photo edit hocche… ektu somoy lagte pare" : wasImageMode ? "chhobi banacche… ektu somoy lagte pare" : "");

    function finish() {
      typing.remove();
      busy = false;
      sendBtn.disabled = false;
      persist();
    }
    function fail(e) {
      typing.remove();
      var msg = "⚠️ Hoye ni: " + e.message;
      addAiMessage(msg, modelName);
      items.push({ who: "ai", text: msg, model: modelName });
      busy = false;
      sendBtn.disabled = false;
      persist();
    }

    if (file || editSrc) {
      var srcPromise = file ? fileToDataUrl(file) : new Promise(function (resolve, reject) {
        var im = new Image();
        im.onload = function () {
          var scale = Math.min(1, 1024 / Math.max(im.width, im.height));
          var cv = document.createElement("canvas");
          cv.width = Math.round(im.width * scale);
          cv.height = Math.round(im.height * scale);
          cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
          resolve(cv.toDataURL("image/png"));
        };
        im.onerror = reject;
        im.src = editSrc;
      });
      srcPromise.then(function (dataUrl) {
        return api("/image-edit", { image: dataUrl, prompt: text, model: modelName });
      }).then(function (j) {
        typing.remove();
        var src = (j.images || [])[0];
        if (src) {
          addAiImage(src, j.title || "", j.revised_prompt || "", modelName);
          items.push({ who: "ai", img: src, title: j.title || "", caption: j.revised_prompt || "", model: modelName });
          setActiveImage(src);
        } else {
          addAiMessage(j.reply || "Chhobi ashe ni.", modelName);
          items.push({ who: "ai", text: j.reply || "Chhobi ashe ni.", model: modelName });
        }
        busy = false;
        sendBtn.disabled = false;
        persist();
      }).catch(fail);
      return;
    }

    if (wasImageMode) {
      api("/image", { prompt: text, model: modelName }).then(function (j) {
        typing.remove();
        var src = (j.images || [])[0];
        if (src) {
          addAiImage(src, j.title || "", j.revised_prompt || "", modelName);
          items.push({ who: "ai", img: src, title: j.title || "", caption: j.revised_prompt || "", model: modelName });
          setActiveImage(src);
        } else {
          addAiMessage(j.reply || "Chhobi ashe ni.", modelName);
          items.push({ who: "ai", text: j.reply || "Chhobi ashe ni.", model: modelName });
        }
        busy = false;
        sendBtn.disabled = false;
        persist();
      }).catch(fail);
      return;
    }

    history.push({ role: "user", content: text });
    api("/chat", { messages: history.slice(), model: modelName }).then(function (j) {
      typing.remove();
      var reply = j.reply || "";
      history.push({ role: "assistant", content: reply });
      addAiMessage(reply, modelName);
      items.push({ who: "ai", text: reply, model: modelName });
      busy = false;
      sendBtn.disabled = false;
      persist();
    }).catch(function (e) {
      history.pop();
      fail(e);
    });
  }

  showEmptyState();
  renderChatList();
  autoGrow();
})();

    </script>
